<rect x="288" y="272" width="80" height="12" rx="2" fill="#0d1117"/>
<text x="328" y="281" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="8" fill="#8b949e" letter-spacing="0.14em" text-anchor="middle">NO DEPENDENCY</text>
